spring.application.name=Portfolio-Management

spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:portfolio_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:n3u3da!}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Run schema.sql at startup
spring.sql.init.mode=always
spring.sql.init.platform=mysql

# Optional logging
logging.level.org.springframework.jdbc.core=INFO


# Server Configuration
server.port=${SERVER_PORT:8080}

# Swagger/OpenAPI
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
