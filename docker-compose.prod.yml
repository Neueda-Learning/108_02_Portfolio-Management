services:
  mysql:
    image: mysql:8
    container_name: portfolio-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-n3u3da!}
      MYSQL_ROOT_HOST: ${MYSQL_ROOT_HOST:-%}
      MYSQL_DATABASE: ${DB_NAME:-portfolio_db}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  backend:
    image: ${BACKEND_IMAGE:-portfolio-backend}:${IMAGE_TAG:-latest}
    container_name: portfolio-backend
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-portfolio_db}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-n3u3da!}
      SERVER_PORT: 8082
    ports:
      - "8082:8082"

  frontend:
    image: ${FRONTEND_IMAGE:-portfolio-frontend}:${IMAGE_TAG:-latest}
    container_name: portfolio-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  mysql-data:

