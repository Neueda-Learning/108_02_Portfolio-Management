services:
  mysql:
    image: mysql:8
    container_name: portfolio-mysql
    environment:
      MYSQL_ROOT_PASSWORD: n3u3da!
      MYSQL_DATABASE: portfolio_db
      MYSQL_ROOT_HOST: "%"
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio-backend
    depends_on:
      - mysql
    ports:
      - "8082:8082"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: portfolio_db
      DB_USER: root
      DB_PASSWORD: n3u3da!
      SERVER_PORT: 8082

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: portfolio-frontend
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  mysql-data: